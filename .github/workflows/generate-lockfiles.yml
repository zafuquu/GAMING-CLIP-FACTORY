name: generate-reproducible-lockfiles

on:
  push:
    branches: [reproducible-dependencies]
    paths:
      - ".github/workflows/generate-lockfiles.yml"
      - "backend/requirements.txt"
      - "frontend/package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-lockfiles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate cross-platform Python dependency lock
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-compile \
            --resolver=backtracking \
            --generate-hashes \
            --strip-extras \
            --output-file=backend/requirements-lock.txt \
            backend/requirements.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Generate npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated locks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/requirements-lock.txt frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git commit -m "build: generate reproducible dependency locks"
          git push origin "HEAD:${GITHUB_REF_NAME}"
