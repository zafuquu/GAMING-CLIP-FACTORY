name: Remotion render smoke test

on:
  push:
    branches: ["main", "feat/remotion-render-engine", "feat/youtube-highlight-intelligence"]
    paths:
      - "remotion/**"
      - "backend/app/worker.py"
      - "backend/app/main.py"
      - "backend/app/twitch_user_auth.py"
      - "backend/app/integrations/twitch_download.py"
      - "backend/app/integrations/youtube_download.py"
      - "scripts/setup-remotion.bat"
      - "scripts/remotion-lock-state.ps1"
      - "tests/test_remotion_render_pipeline.py"
      - "tests/test_twitch_download.py"
      - "tests/test_highlight_detector.py"
      - "tests/test_youtube_highlight_intelligence.py"
      - "tests/test_youtube_download.py"
      - "backend/requirements.txt"
      - "backend/requirements-lock-linux-py311.txt"
      - "backend/requirements-lock-linux-py312.txt"
      - "backend/requirements-lock-win-py311.txt"
      - "backend/requirements-lock-win-py312.txt"
      - "backend/requirements-ml-lock-linux-py311.txt"
      - "backend/requirements-ml-lock-linux-py312.txt"
      - "backend/requirements-ml-lock-win-py311.txt"
      - "backend/requirements-ml-lock-win-py312.txt"
      - "scripts/start.bat"
      - ".env.example"
      - "README.md"
      - ".github/workflows/remotion-render-smoke.yml"
  pull_request:
    paths:
      - "remotion/**"
      - "backend/app/worker.py"
      - "backend/app/main.py"
      - "backend/app/twitch_user_auth.py"
      - "backend/app/integrations/twitch_download.py"
      - "backend/app/integrations/youtube_download.py"
      - "scripts/setup-remotion.bat"
      - "tests/test_remotion_render_pipeline.py"
      - "tests/test_twitch_download.py"
      - "tests/test_highlight_detector.py"
      - "tests/test_youtube_highlight_intelligence.py"
      - "tests/test_youtube_download.py"
      - "backend/requirements.txt"
      - "backend/requirements-lock-linux-py311.txt"
      - "backend/requirements-lock-linux-py312.txt"
      - "backend/requirements-lock-win-py311.txt"
      - "backend/requirements-lock-win-py312.txt"
      - "backend/requirements-ml-lock-linux-py311.txt"
      - "backend/requirements-ml-lock-linux-py312.txt"
      - "backend/requirements-ml-lock-win-py311.txt"
      - "backend/requirements-ml-lock-win-py312.txt"
      - "scripts/start.bat"
      - ".env.example"
      - "README.md"
      - ".github/workflows/remotion-render-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remotion-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remotion-render-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install backend test dependencies
        run: python -m pip install --require-hashes -r backend/requirements-lock-linux-py312.txt
      - name: Install locked Remotion dependencies
        working-directory: remotion
        run: npm ci --no-audit --no-fund
      - name: Render a synthetic clip and validate its streams
        working-directory: remotion
        run: npm run test:render
      - name: Exercise the actual FastAPI worker, Remotion render, and QC path
        run: python -m pytest -q tests/test_remotion_render_pipeline.py tests/test_twitch_download.py tests/test_highlight_detector.py tests/test_youtube_highlight_intelligence.py tests/test_youtube_download.py
  remotion-render-smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress --execution-timeout=300
          $chocoBin = Join-Path $env:ProgramData "chocolatey\\bin"
          $env:Path = "$chocoBin;$env:Path"
          $chocoBin | Out-File -FilePath $env:GITHUB_PATH -Append
          & (Join-Path $chocoBin "ffmpeg.exe") -version
          & (Join-Path $chocoBin "ffprobe.exe") -version
      - name: Install backend test dependencies
        run: python -m pip install --require-hashes -r backend/requirements-lock-win-py312.txt
      - name: Install locked Remotion dependencies
        working-directory: remotion
        run: npm ci --no-audit --no-fund
      - name: Render synthetic media through Remotion on Windows
        working-directory: remotion
        run: npm run test:render
      - name: Exercise Windows FastAPI worker, Remotion render, and QC
        run: python -m pytest -q tests/test_remotion_render_pipeline.py tests/test_twitch_download.py tests/test_highlight_detector.py tests/test_youtube_highlight_intelligence.py tests/test_youtube_download.py
