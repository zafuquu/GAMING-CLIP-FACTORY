name: generate-reproducible-lockfiles

on:
  push:
    branches: [reproducible-dependencies]
    paths:
      - ".github/workflows/generate-lockfiles.yml"
      - "backend/requirements.txt"
      - "backend/requirements-ml.txt"
      - "frontend/package.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: generate-lockfiles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_key: linux
            python_version: "3.11"
            python_key: py311
          - os: ubuntu-latest
            os_key: linux
            python_version: "3.12"
            python_key: py312
          - os: windows-latest
            os_key: win
            python_version: "3.11"
            python_key: py311
          - os: windows-latest
            os_key: win
            python_version: "3.12"
            python_key: py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
      - name: Install lock generator
        run: python -m pip install --upgrade pip pip-tools
      - name: Compile platform-specific standard and ML locks
        shell: bash
        run: |
          python -m piptools compile \
            --resolver=backtracking \
            --generate-hashes \
            --strip-extras \
            --output-file="backend/requirements-lock-${{ matrix.os_key }}-${{ matrix.python_key }}.txt" \
            backend/requirements.txt
          python -m piptools compile \
            --resolver=backtracking \
            --generate-hashes \
            --strip-extras \
            --constraint="backend/requirements-lock-${{ matrix.os_key }}-${{ matrix.python_key }}.txt" \
            --output-file="backend/requirements-ml-lock-${{ matrix.os_key }}-${{ matrix.python_key }}.txt" \
            backend/requirements-ml.txt
      - uses: actions/upload-artifact@v6
        with:
          name: lock-${{ matrix.os_key }}-${{ matrix.python_key }}
          path: |
            backend/requirements-lock-${{ matrix.os_key }}-${{ matrix.python_key }}.txt
            backend/requirements-ml-lock-${{ matrix.os_key }}-${{ matrix.python_key }}.txt
          if-no-files-found: error
          retention-days: 3

  aggregate:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/download-artifact@v7
        with:
          pattern: lock-*
          path: generated-locks
          merge-multiple: true
      - name: Install generated matrix locks
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          standard=(generated-locks/requirements-lock-*.txt)
          optional=(generated-locks/requirements-ml-lock-*.txt)
          test "${#standard[@]}" -eq 4
          test "${#optional[@]}" -eq 4
          cp "${standard[@]}" backend/
          cp "${optional[@]}" backend/
      - name: Commit generated platform locks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/requirements-lock-*.txt backend/requirements-ml-lock-*.txt
          git diff --cached --quiet && { echo "Locks are already current."; exit 0; }
          git commit -m "build: generate OS and Python-specific dependency locks"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
