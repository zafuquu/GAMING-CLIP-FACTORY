name: dependency-security-audit

on:
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/requirements*.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/dependency-security-audit.yml"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: dependency-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lock-audit:
    name: "pip-audit ${{ matrix.os_key }} ${{ matrix.python_version }} ${{ matrix.profile }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_key: linux
            python_version: "3.11"
            profile: base
            lock: backend/requirements-lock-linux-py311.txt
          - runner: ubuntu-latest
            os_key: linux
            python_version: "3.11"
            profile: optional-ml
            lock: backend/requirements-ml-lock-linux-py311.txt
          - runner: ubuntu-latest
            os_key: linux
            python_version: "3.12"
            profile: base
            lock: backend/requirements-lock-linux-py312.txt
          - runner: ubuntu-latest
            os_key: linux
            python_version: "3.12"
            profile: optional-ml
            lock: backend/requirements-ml-lock-linux-py312.txt
          - runner: windows-latest
            os_key: win
            python_version: "3.11"
            profile: base
            lock: backend/requirements-lock-win-py311.txt
          - runner: windows-latest
            os_key: win
            python_version: "3.11"
            profile: optional-ml
            lock: backend/requirements-ml-lock-win-py311.txt
          - runner: windows-latest
            os_key: win
            python_version: "3.12"
            profile: base
            lock: backend/requirements-lock-win-py312.txt
          - runner: windows-latest
            os_key: win
            python_version: "3.12"
            profile: optional-ml
            lock: backend/requirements-ml-lock-win-py312.txt
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
      - name: Install audit tool
        run: python -m pip install --upgrade pip-audit
      - name: Audit the exact hashed lock
        run: python -m pip_audit --require-hashes --disable-pip -r ${{ matrix.lock }} --strict

  npm-lock-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependency tree
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Audit production and development dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
