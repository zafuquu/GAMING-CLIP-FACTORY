name: Live YouTube to Shorts acceptance

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "HTTPS URL of a video you own or have explicit editing permission for"
        required: true
        type: string
        default: ""
      owner_authorized:
        description: "Confirm that you own this video or have explicit permission to download/edit it"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-youtube-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-youtube-e2e-windows:
    if: ${{ inputs.owner_authorized == true }}
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.13.1"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress --execution-timeout=300
          $chocoBin = Join-Path $env:ProgramData "chocolatey\bin"
          $env:Path = "$chocoBin;$env:Path"
          $chocoBin | Out-File -FilePath $env:GITHUB_PATH -Append
          & (Join-Path $chocoBin "ffmpeg.exe") -version
          & (Join-Path $chocoBin "ffprobe.exe") -version
      - name: Install hashed backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements-lock-win-py312.txt
      - name: Install locked Remotion dependencies
        working-directory: remotion
        run: npm ci --no-audit --no-fund
      - name: Download the authorized video, analyze it, and render a Short
        shell: pwsh
        env:
          GCF_E2E_REPORT_PATH: ${{ github.workspace }}\live-youtube-e2e-report.json
          GCF_E2E_YOUTUBE_URL: ${{ inputs.youtube_url }}
          GCF_E2E_OWNER_CONFIRMED: ${{ inputs.owner_authorized }}
        run: python scripts/live_youtube_e2e.py
      - name: Upload only the JSON acceptance report (never the source or rendered video)
        if: always() && hashFiles('live-youtube-e2e-report.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: live-youtube-e2e-report
          path: live-youtube-e2e-report.json
          if-no-files-found: warn
          retention-days: 7
